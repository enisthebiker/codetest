<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Beautifier | Enis Lab</title>
<style>
:root {
    color-scheme: dark;
    --bg: #10141d;
    --panel: #171e2b;
    --panel-light: #202a3a;
    --border: #303c50;
    --text: #e8edf5;
    --muted: #9aa8ba;
    --accent: #55c2ff;
    --accent-hover: #83d2ff;
    --success: #67d7a2;
    --danger: #ff8585;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
}
header {
    padding: 22px 24px 18px;
    text-align: center;
    background: #171e2b;
    border-bottom: 1px solid var(--border);
}
header h1 {
    margin: 0 0 8px;
    font-size: 25px;
    font-weight: 650;
}
header h1 span { color: var(--accent); }
header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
}
main {
    width: min(1500px, 100%);
    margin: 0 auto;
    padding: 22px;
}
.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding: 13px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
}
.control-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.toolbar label {
    color: var(--muted);
    font-size: 13px;
}
select, button {
    min-height: 37px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel-light);
    color: var(--text);
    font: inherit;
    font-size: 13px;
}
select { padding: 0 30px 0 10px; }
button {
    padding: 0 14px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
}
button:hover {
    border-color: var(--accent);
    background: #29394d;
}
button.primary {
    color: #07131d;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
}
button.primary:hover { background: var(--accent-hover); }
button:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}
.spacer { flex: 1; }
.editors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.editor-panel {
    min-width: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
}
.panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 45px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
}
.panel-heading small {
    color: #718197;
    font-weight: 400;
}
textarea {
    display: block;
    width: 100%;
    height: min(62vh, 650px);
    min-height: 330px;
    resize: vertical;
    padding: 16px;
    border: 0;
    outline: none;
    background: #0d121a;
    color: #dce8f7;
    font: 13px/1.65 Consolas, "Courier New", monospace;
    tab-size: 4;
    white-space: pre;
}
textarea::placeholder { color: #637187; }
#output { background: #111925; }
.status {
    min-height: 24px;
    margin: 12px 2px 0;
    color: var(--muted);
    font-size: 13px;
}
.status.success { color: var(--success); }
.status.error { color: var(--danger); }
footer {
    padding: 10px 20px 22px;
    color: #718197;
    text-align: center;
    font-size: 12px;
}
@media (max-width: 760px) {
    main { padding: 14px; }
    .editors { grid-template-columns: 1fr; }
    textarea { height: 42vh; min-height: 260px; }
    .spacer { display: none; }
    .toolbar { align-items: stretch; }
    .control-group { justify-content: space-between; }
}
</style>
</head>
<body>
<header>
    <h1>🪄 Code <span>Beautifier</span></h1>
    <p>HTML, CSS, JavaScript ve JSON kodlarını düzenle ve okunabilir hâle getir.</p>
</header>

<main>
    <section class="toolbar" aria-label="Biçimlendirme araçları">
        <div class="control-group">
            <label for="language">Kod türü</label>
            <select id="language">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
                <option value="json">JSON</option>
            </select>
        </div>
        <div class="control-group">
            <label for="indent">Girinti</label>
            <select id="indent">
                <option value="2">2 boşluk</option>
                <option value="4" selected>4 boşluk</option>
                <option value="tab">Sekme (Tab)</option>
            </select>
        </div>
        <span class="spacer"></span>
        <button class="primary" id="formatBtn" type="button">✨ Biçimlendir</button>
        <button id="copyBtn" type="button">Kopyala</button>
        <button id="useOutputBtn" type="button">Çıktıyı girişe aktar</button>
        <button id="clearBtn" type="button">Temizle</button>
    </section>

    <section class="editors">
        <div class="editor-panel">
            <div class="panel-heading">
                <span>GİRİŞ</span>
                <small>Biçimlendirilecek kod</small>
            </div>
            <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Kodunu buraya yapıştır..."></textarea>
        </div>
        <div class="editor-panel">
            <div class="panel-heading">
                <span>ÇIKIŞ</span>
                <small>Biçimlendirilmiş sonuç</small>
            </div>
            <textarea id="output" spellcheck="false" readonly placeholder="Biçimlendirilmiş kod burada görünecek..."></textarea>
        </div>
    </section>
    <div id="status" class="status" role="status" aria-live="polite">Hazır. Kodunu giriş alanına yapıştırıp Biçimlendir'e tıkla.</div>
</main>

<footer>Developed by Enis Baydemir · Enis ChatGPT Lab</footer>

<!-- js-beautify: MIT License. Kod tarayıcıda biçimlendirilir. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/2.0.3/beautify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/2.0.3/beautify-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/2.0.3/beautify-html.min.js"></script>
<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const language = document.getElementById("language");
const indent = document.getElementById("indent");
const statusBox = document.getElementById("status");

function showStatus(message, type = "") {
    statusBox.textContent = message;
    statusBox.className = "status" + (type ? " " + type : "");
}

function formatCode() {
    const code = input.value;
    if (!code.trim()) {
        output.value = "";
        showStatus("Önce giriş alanına bir kod eklemelisin.", "error");
        return;
    }

    const indentValue = indent.value === "tab" ? "\t" : " ".repeat(Number(indent.value));
    const options = {
        indent_size: indent.value === "tab" ? 1 : Number(indent.value),
        indent_char: indentValue,
        end_with_newline: true
    };

    try {
        let result;
        switch (language.value) {
            case "html":
                result = html_beautify(code, options);
                break;
            case "css":
                result = css_beautify(code, options);
                break;
            case "js":
                result = js_beautify(code, options);
                break;
            case "json":
                result = JSON.stringify(JSON.parse(code), null, indentValue);
                break;
            default:
                throw new Error("Desteklenmeyen kod türü.");
        }
        output.value = result;
        showStatus("Kod başarıyla biçimlendirildi.", "success");
    } catch (error) {
        showStatus("Biçimlendirme hatası: " + error.message, "error");
    }
}

document.getElementById("formatBtn").addEventListener("click", formatCode);

document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!output.value) {
        showStatus("Kopyalanacak bir çıktı yok.", "error");
        return;
    }
    try {
        await navigator.clipboard.writeText(output.value);
        showStatus("Çıktı panoya kopyalandı.", "success");
    } catch {
        output.focus();
        output.select();
        const copied = document.execCommand("copy");
        showStatus(copied ? "Çıktı panoya kopyalandı." : "Kopyalama başarısız oldu. Çıktıyı seçip Ctrl+C kullanabilirsin.", copied ? "success" : "error");
    }
});

document.getElementById("useOutputBtn").addEventListener("click", () => {
    if (!output.value) {
        showStatus("Aktarılacak bir çıktı yok.", "error");
        return;
    }
    input.value = output.value;
    output.value = "";
    input.focus();
    showStatus("Çıktı giriş alanına aktarıldı.", "success");
});

document.getElementById("clearBtn").addEventListener("click", () => {
    input.value = "";
    output.value = "";
    input.focus();
    showStatus("Alanlar temizlendi.");
});

document.addEventListener("keydown", event => {
    if (event.ctrlKey && event.key === "Enter") {
        event.preventDefault();
        formatCode();
    }
});
</script>
</body>
</html>
